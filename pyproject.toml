[project]
name = "fpl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tony Ward", email = "tony@statcore.co.uk" }
]
requires-python = ">=3.7"
dependencies = [
    "anthropic>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "nbformat>=5.8.0",
    "pandas>=1.1.5",
    "playwright>=1.35.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "tokenizers<0.20",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
    "jupyterlab>=3.6.8",
    "pytest>=7.4.4",
]
